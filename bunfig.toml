[run]
shell = "system"

# ──────────────────────────────────────────────────────────────────────────
# Coverage ratchet (documentation of the enforced floor).
#
# The api suite runs from `apps/api`, and Bun uses the *nearest* bunfig
# (`apps/api/bunfig.toml`) — it does not merge bunfig files up the tree — so a
# `[test]` block here would never apply to that suite. Bun 1.4.2 did not fail
# a run on `coverageThreshold`; Bun 1.4.4 does (verified: `bun test
# --coverage` exits 1 at 25% lines against a 0.99 threshold), so the threshold
# in `apps/api/bunfig.toml` now fails `bun run test` too.
#
# `.github/workflows/ci.yml` ("Coverage gate" step) also runs the api coverage
# and fails the build if the text-reporter "All files" row drops below the
# floor below.
#
# Measured baseline 2026-10-24 (full api suite, 828 tests, 0 fail, Bun 1.4.4),
# text reporter "All files" (honours `coveragePathIgnorePatterns`):
#   lines 88.42%, functions 84.26%.
# Ratchet floor — the same as `apps/api/bunfig.toml`'s threshold, so the CI
# gate and `bun test` fail at the same point (never lowered to make red pass):
#   line >= 85, function >= 70
[test]
coverage = true
coverageThreshold = { line = 0.85, function = 0.70 }
